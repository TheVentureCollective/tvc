[build]
  command = "npm run build"
  publish = "dist"
  # Skip the build (and its credits) unless something that affects the site changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public package.json package-lock.json astro.config.mjs netlify.toml"

[build.environment]
  NODE_VERSION = "22"
